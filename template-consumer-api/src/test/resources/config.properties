# Product API configuration placeholder. The offline smoke contract uses an in-process server.
api.base-url=https://replace-me-with-api-url.example
# Authentication is disabled for the offline starter smoke test. Set a mode per product when wiring its real service.
auth.mode=none
auth.profile=api
# For json-bearer-login/json-cookie-login, configure auth.login-url and field/path names here.
# Keep auth.token, auth.cookie-value, auth.username, and auth.password in environment variables or a secret manager.
# Optional database settings are provided through DB_JDBC_URL, DB_USERNAME, and DB_PASSWORD.
# Keep database tests disabled for projects that do not need direct database validation.
