workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

default:
  image: eclipse-temurin:17-jdk
  interruptible: true
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository/
  before_script:
    - chmod +x mvnw

stages:
  - validate
  - test
  - deploy
  - compatibility-config
  - compatibility
  - notify

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B -ntp -Dstyle.color=never"
  API_FRAMEWORK_VERSION: "1.0.2-SNAPSHOT"
  API_GCONNECT_BRANCH: "main"

validate:
  stage: validate
  script:
    - ./mvnw $MAVEN_CLI_OPTS -DskipTests package

test:
  stage: test
  script:
    - ./mvnw $MAVEN_CLI_OPTS install
    - cd template-consumer-api
    - ./mvnw $MAVEN_CLI_OPTS -Dapi.test.parallel=classes clean verify
    - cd "$CI_PROJECT_DIR"
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - "*/target/surefire-reports/TEST-*.xml"
    paths:
      - "*/target/api-traces/"
      - "*/target/surefire-reports/"
      - "*/target/*.jar"

deploy:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        RELEASE_VERSION="${CI_COMMIT_TAG#v}"
        ./mvnw $MAVEN_CLI_OPTS versions:set -DnewVersion="$RELEASE_VERSION" -DprocessAllModules=true -DgenerateBackupPoms=false
      fi
    - ./mvnw $MAVEN_CLI_OPTS deploy -DskipTests -s ci_settings.xml

pages:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'
  script:
    - ./mvnw $MAVEN_CLI_OPTS javadoc:aggregate -Ddoclint=none -Dquiet=true
    - mkdir -p public
    - cp -r target/reports/apidocs/* public/
  artifacts:
    paths:
      - public
    expire_in: 30 days

gconnect-target-check:
  stage: compatibility-config
  script:
    - test -n "$API_GCONNECT_PROJECT_PATH" || { echo "Set API_GCONNECT_PROJECT_PATH in project CI/CD variables before enabling framework compatibility checks."; exit 1; }
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

gconnect-compatibility:
  stage: compatibility
  inherit:
    variables:
      - API_FRAMEWORK_VERSION
  trigger:
    project: "$API_GCONNECT_PROJECT_PATH"
    branch: "$API_GCONNECT_BRANCH"
    strategy: mirror
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

telegram-success:
  stage: notify
  image: python:3.12-slim
  when: on_success
  variables:
    TELEGRAM_CHAT_ID: "$TELEGRAM_CHAT_AG270"
    TELEGRAM_THREAD_ID: "$TELEGRAM_THREAD_AG270_API"
    TELEGRAM_STATUS: "success"
  script:
    - python3 scripts/notify_telegram.py
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $TELEGRAM_BOT_TOKEN && $TELEGRAM_CHAT_AG270 && $TELEGRAM_THREAD_AG270_API'
      when: on_success
    - when: never
  allow_failure: true

telegram-failure:
  stage: notify
  image: python:3.12-slim
  when: on_failure
  variables:
    TELEGRAM_CHAT_ID: "$TELEGRAM_CHAT_AG270"
    TELEGRAM_THREAD_ID: "$TELEGRAM_THREAD_AG270_CI_FAILURES"
    TELEGRAM_STATUS: "failed"
  script:
    - python3 scripts/notify_telegram.py
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $TELEGRAM_BOT_TOKEN && $TELEGRAM_CHAT_AG270 && $TELEGRAM_THREAD_AG270_CI_FAILURES'
      when: on_failure
    - when: never
  allow_failure: true
