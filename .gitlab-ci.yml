workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

default:
  image: eclipse-temurin:17-jdk
  interruptible: true
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository/
  before_script:
    - chmod +x mvnw

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B -ntp -Dstyle.color=never"

stages:
  - validate
  - test
  - deploy

validate:
  stage: validate
  script:
    - ./mvnw $MAVEN_CLI_OPTS -DskipTests package

test:
  stage: test
  script:
    - ./mvnw $MAVEN_CLI_OPTS verify
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - "*/target/surefire-reports/TEST-*.xml"
    paths:
      - "*/target/api-traces/"
      - "*/target/surefire-reports/"
      - "*/target/*.jar"

deploy:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'
  script:
    - ./mvnw $MAVEN_CLI_OPTS deploy -DskipTests -s ci_settings.xml
