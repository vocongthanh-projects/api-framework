workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

default:
  image: eclipse-temurin:17-jdk
  interruptible: true
  cache:
    key:
      files:
        - pom.xml
        - .mvn/wrapper/maven-wrapper.properties
    paths:
      - .m2/repository/
  before_script:
    - chmod +x mvnw

stages:
  - validate
  - notify

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B -ntp -Dstyle.color=never"

compile-framework-and-template:
  stage: validate
  timeout: 15m
  script:
    - ./mvnw $MAVEN_CLI_OPTS -DskipTests clean install
    - cd template-consumer-api
    - ./mvnw $MAVEN_CLI_OPTS -DskipTests clean verify

telegram-success:
  stage: notify
  image: python:3.12-slim
  timeout: 2m
  when: on_success
  variables:
    TELEGRAM_CHAT_ID: "$TELEGRAM_CHAT_GITLAB_OTS_FLI"
    TELEGRAM_THREAD_ID: "$TELEGRAM_THREAD_GITLAB_OTS_FLI"
    TELEGRAM_STATUS: "SUCCESS"
  script:
    - python3 scripts/notify_telegram.py
  rules:
    - if: '$TELEGRAM_BOT_TOKEN && $TELEGRAM_CHAT_GITLAB_OTS_FLI && $TELEGRAM_THREAD_GITLAB_OTS_FLI'
      when: on_success
    - when: never
  allow_failure: true

telegram-failure:
  stage: notify
  image: python:3.12-slim
  timeout: 2m
  when: on_failure
  variables:
    TELEGRAM_CHAT_ID: "$TELEGRAM_CHAT_GITLAB_OTS_FLI"
    TELEGRAM_THREAD_ID: "$TELEGRAM_THREAD_GITLAB_OTS_FLI"
    TELEGRAM_STATUS: "FAILED"
  script:
    - python3 scripts/notify_telegram.py
  rules:
    - if: '$TELEGRAM_BOT_TOKEN && $TELEGRAM_CHAT_GITLAB_OTS_FLI && $TELEGRAM_THREAD_GITLAB_OTS_FLI'
      when: on_failure
    - when: never
  allow_failure: true
